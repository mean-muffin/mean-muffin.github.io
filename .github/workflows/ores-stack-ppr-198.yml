name: ores-stack-ppr-198

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-stack-ppr-198.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Fetch exact ores-stack integration branch anonymously
        shell: bash
        run: |
          set -euo pipefail
          expected=38339982528d5a172ca8105d01a91d572a067952
          source_branch=feat/ppr-supervisor-framing-integration-20260922
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=1 origin "$source_branch"
          git -C ores-stack checkout --detach FETCH_HEAD
          actual="$(git -C ores-stack rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy

      - name: Cargo format
        shell: bash
        working-directory: ores-stack
        run: cargo fmt --all -- --check

      - name: Cargo check integrated PPR stack
        shell: bash
        working-directory: ores-stack
        run: cargo check -p ores-stack-cli -p ores-stack-ppr-http -p ores-stack-process-tree -p ores-stack-middleware-runner --all-targets

      - name: Cargo clippy integrated PPR stack
        shell: bash
        working-directory: ores-stack
        run: cargo clippy -p ores-stack-cli -p ores-stack-ppr-http -p ores-stack-process-tree -p ores-stack-middleware-runner --all-targets -- -D warnings

      - name: PPR primitive tests
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          cargo test -p ores-stack-ppr-http
          cargo test -p ores-stack-process-tree
          cargo test -p ores-stack-middleware-runner

  stream-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Fetch exact ores-stack integration branch anonymously
        shell: bash
        run: |
          set -euo pipefail
          expected=38339982528d5a172ca8105d01a91d572a067952
          source_branch=feat/ppr-supervisor-framing-integration-20260922
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=1 origin "$source_branch"
          git -C ores-stack checkout --detach FETCH_HEAD
          actual="$(git -C ores-stack rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0

      - name: Build ores-stack CLI
        shell: bash
        working-directory: ores-stack
        run: cargo build -p ores-stack-cli

      - name: Delayed multi-chunk PPR E2E
        shell: bash
        working-directory: ores-stack
        run: ./scripts/ppr-server-stream-e2e.sh
