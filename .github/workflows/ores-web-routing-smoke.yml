name: ores-web-routing-smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'routing-smoke/**'
      - '.github/workflows/ores-web-routing-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Stable Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --manifest-path routing-smoke/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --manifest-path routing-smoke/Cargo.toml --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --manifest-path routing-smoke/Cargo.toml --locked --all-targets
