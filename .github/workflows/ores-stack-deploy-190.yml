name: ores-stack-deploy-190

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-stack-deploy-190.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout exact ores-stack PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ORESoftware/ores-stack
          ref: 0a28b5e250e0926ca18c397f496c7b53aebb19e1
          path: ores-stack
          persist-credentials: false

      - name: Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt

      - name: Cargo format
        working-directory: ores-stack
        run: cargo fmt --all -- --check

      - name: Cargo check CLI
        working-directory: ores-stack
        run: cargo check -p ores-stack-cli

      - name: Shared JSON propagation regression
        working-directory: ores-stack
        run: cargo test -p ores-stack-cli deploy_receives_resolved_shared_json_output_mode -- --exact

      - name: Deploy integrity regressions
        working-directory: ores-stack
        run: cargo test -p ores-stack-cli --test deploy_artifact_integrity --test deploy_generated_env
