name: ores-stack-deploy-190

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-stack-deploy-190.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Fetch exact ores-stack PR head anonymously
        shell: bash
        run: |
          set -euo pipefail
          expected=0a28b5e250e0926ca18c397f496c7b53aebb19e1
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=1 origin "$expected"
          git -C ores-stack checkout --detach FETCH_HEAD
          actual="$(git -C ores-stack rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Rust 1.88
        run: |
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt

      - name: Cargo format
        working-directory: ores-stack
        run: cargo fmt --all -- --check

      - name: Cargo check CLI
        working-directory: ores-stack
        run: cargo check -p ores-stack-cli

      - name: Shared JSON propagation regression
        working-directory: ores-stack
        run: cargo test -p ores-stack-cli deploy_receives_resolved_shared_json_output_mode

      - name: Deploy integrity regressions
        working-directory: ores-stack
        run: cargo test -p ores-stack-cli --test deploy_artifact_integrity --test deploy_generated_env
